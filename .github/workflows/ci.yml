name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @aster/conformance exec playwright install --with-deps chromium

      # The gate list lives in scripts/gates.mjs (single source of truth, also
      # what `pnpm check` runs locally). Do not add gates here; edit that file.
      - name: Gates (pnpm check)
        run: pnpm check
