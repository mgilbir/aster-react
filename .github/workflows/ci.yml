name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Dependency boundary
        run: pnpm check:deps

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Conformance
        run: pnpm conformance

      - name: Gap probes (diagnostic, non-blocking)
        run: pnpm probe
        continue-on-error: true

      - name: Bundle budget
        run: pnpm --filter @aster/benchmarks run budget
