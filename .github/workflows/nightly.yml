name: Nightly sweeps

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  sweeps:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The full PR gate list (scripts/gates.mjs), then the heavier nightly-only runs.
      - name: Install Playwright browsers
        run: pnpm --filter @aster/conformance exec playwright install --with-deps chromium firefox webkit

      - name: Gates (pnpm check)
        run: pnpm check

      - name: Firefox canvas parity
        run: pnpm conformance:canvas -- --browser=firefox

      - name: WebKit canvas parity
        run: pnpm conformance:canvas -- --browser=webkit

      - name: Large incremental append benchmark
        run: pnpm bench:incremental -- --points=100000 --reps=40

      - name: Streaming browser benchmark
        run: pnpm bench:browser-stream -- --points=10000 --seconds=3

      - name: Browser mount/update/no-op benchmark
        run: pnpm bench:browser -- --points=1000 --memory=false

      - name: Dense-SVG streaming benchmark
        run: pnpm bench:browser-stream -- --points=100000 --seconds=3 --engines=aster --renderers=svg --dense=0,1

      - name: Vega-Lite schema sweep
        run: pnpm sweep-vl -- --floor 27513 --min-ok 27452 --max-node-error 17 --vega-check

      - name: Vega schema sweep
        run: pnpm sweep-vega -- --floor 7549 --min-ok 7538 --max-node-error 3

      - name: Differential fuzzing (deterministic seeds)
        run: pnpm --filter @aster/conformance run fuzz -- --seeds 3000

      - name: Upload reproducers on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-repro-${{ github.run_id }}
          path: packages/conformance/fuzz-repro/*.vg.json
          if-no-files-found: ignore
