name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:deps
      - run: pnpm typecheck
      - run: pnpm test

      # Pack each public package, assert the tarball carries the licence files,
      # and import/render through the published exports in a clean node_modules.
      - run: pnpm verify:publish

      # Private workspaces (conformance, benchmarks, demo) are skipped by
      # pnpm; the three public packages carry publishConfig.provenance.
      - name: Publish public packages
        run: pnpm -r --filter './packages/**' publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
